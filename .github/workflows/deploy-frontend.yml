name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  BACKEND_STACK_NAME: M9Backend
  FRONTEND_STACK_NAME: M9Frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        id: stack
        run: |
          frontend_outputs="$(aws cloudformation describe-stacks \
            --stack-name "$FRONTEND_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)"
          backend_outputs="$(aws cloudformation describe-stacks \
            --stack-name "$BACKEND_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)"

          echo "bucket=$(jq -r '.[] | select(.OutputKey=="BucketName") | .OutputValue' <<< "$frontend_outputs")" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(jq -r '.[] | select(.OutputKey=="DistributionId") | .OutputValue' <<< "$frontend_outputs")" >> "$GITHUB_OUTPUT"
          echo "backend_url=$(jq -r '.[] | select(.OutputKey=="LoadBalancerUrl") | .OutputValue' <<< "$backend_outputs")/api/v1" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || steps.stack.outputs.backend_url }}
        run: |
          npm ci
          npm run build

      - name: Upload to S3
        run: aws s3 sync frontend/dist "s3://${{ steps.stack.outputs.bucket }}" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution_id }}" \
            --paths "/*"
