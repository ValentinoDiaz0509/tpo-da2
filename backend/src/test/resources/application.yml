spring:
  datasource:
    url: jdbc:h2:mem:monitoring-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

# No external messaging in tests: don't start the RabbitMQ listener and don't call the Core.
healthgrid:
  rabbit:
    enabled: false
  module10:
    core:
      enabled: false
  module6:
    webhook:
      enabled: false

simulator:
  enabled: false

server:
  servlet:
    context-path: /api/v1
