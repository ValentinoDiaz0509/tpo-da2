spring:
  profiles:
    default: local
  application:
    name: patient-monitoring-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      auto-commit: true
  rabbitmq:
    host: ${RABBITMQ_HOST:queue.healthgrid.cantero.ar}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # Requeue rejected messages onto the DLQ created by the Core, not back to the main queue
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000

healthgrid:
  rabbit:
    # Consumo del bus de eventos del Core (M10). El listener escucha esta cola en RabbitMQ.
    enabled: ${HEALTHGRID_RABBIT_ENABLED:true}
    monitoring-queue: ${HEALTHGRID_RABBIT_MONITORING_QUEUE:monitoring.requests}
  module6:
    webhook:
      url: ${MODULE6_WEBHOOK_URL:http://localhost:8086/webhooks/monitoreo/alerta-emergencia}
      alerta-emergencia:
        url: ${MODULE6_WEBHOOK_ALERTA_EMERGENCIA_URL:${MODULE6_WEBHOOK_URL:http://localhost:8086/webhooks/monitoreo/alerta-emergencia}}
      alerta-resuelta:
        url: ${MODULE6_WEBHOOK_ALERTA_RESUELTA_URL:http://localhost:8086/webhooks/monitoreo/alerta-resuelta}
      token: ${MODULE6_WEBHOOK_TOKEN:mock-jwt-token-for-m6}
      enabled: ${MODULE6_WEBHOOK_ENABLED:true}
  module10:
    core:
      url: ${MODULE10_CORE_URL:https://api.healthcare.cantero.ar}
      auth:
        email: ${MODULE10_CORE_EMAIL:}
        password: ${MODULE10_CORE_PASSWORD:}
      enabled: ${MODULE10_CORE_ENABLED:true}
      # event_type_id de los eventos hacia M6 (ver docs/architecture/shared_docs/M6_INTEGRACION_M9_MONITOREO)
      events:
        alerta-emergencia-id: ${MODULE10_EVENT_ALERTA_EMERGENCIA_ID:16}   # internacion.alerta-emergencia.detectada
        alerta-resuelta-id: ${MODULE10_EVENT_ALERTA_RESUELTA_ID:17}       # internacion.alerta-resuelta.notificada

server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    rabbit:
      # A RabbitMQ outage/misconfiguration must not drag the whole /actuator/health
      # (and therefore the ALB target-group health check) to DOWN.
      enabled: false
  metrics:
    export:
      simple:
        enabled: true

simulator:
  enabled: ${SIMULATOR_ENABLED:true}
  rate: ${SIMULATOR_RATE:3000}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173,https://*.cloudfront.net}

logging:
  level:
    root: INFO
    com.healthgrid.monitoring: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    groups-order: DESC
    operations-sorter: method
    tags-sorter: alpha
