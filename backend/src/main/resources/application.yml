spring:
  profiles:
    default: local
  application:
    name: patient-monitoring-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    show-sql: false
    open-in-view: false
  datasource:
    url: jdbc:postgresql://localhost:5432/monitoring_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      auto-commit: true
  cloud:
    stream:
      bindings:
        patientEventInput:
          destination: patient-events-queue
          group: monitoring-service-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
        telemetryEventInput:
          destination: telemetry-readings-queue
          group: telemetry-service-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-max-interval: 10000
      aws-sqs:
        auto-create-queue: true

aws:
  sqs:
    admission-queue: ${AWS_SQS_ADMISSION_QUEUE:admission-events-queue}
    admission-queue-url: ${AWS_SQS_ADMISSION_QUEUE_URL:http://localhost:4566/000000000000/admission-events-queue}
    endpoint: ${AWS_SQS_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    enabled: ${AWS_SQS_ENABLED:true}

healthgrid:
  module6:
    webhook:
      url: ${MODULE6_WEBHOOK_URL:http://localhost:8086/webhooks/monitoreo/alerta-emergencia}
      alerta-emergencia:
        url: ${MODULE6_WEBHOOK_ALERTA_EMERGENCIA_URL:${MODULE6_WEBHOOK_URL:http://localhost:8086/webhooks/monitoreo/alerta-emergencia}}
      alerta-resuelta:
        url: ${MODULE6_WEBHOOK_ALERTA_RESUELTA_URL:http://localhost:8086/webhooks/monitoreo/alerta-resuelta}
      token: ${MODULE6_WEBHOOK_TOKEN:mock-jwt-token-for-m6}
      enabled: ${MODULE6_WEBHOOK_ENABLED:true}
  module10:
    core:
      url: ${MODULE10_CORE_URL:http://localhost:8081}
      auth:
        email: ${MODULE10_CORE_EMAIL:cuenta-servicio-m9@healthgrid.com}
        password: ${MODULE10_CORE_PASSWORD:m9-secret}
      enabled: true
  credentials:
    access-key: test
    secret-key: test

server:
  port: 8080
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

simulator:
  enabled: ${SIMULATOR_ENABLED:true}
  rate: ${SIMULATOR_RATE:3000}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173,https://*.cloudfront.net}

logging:
  level:
    root: INFO
    com.healthgrid.monitoring: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    display-request-duration: true
    groups-order: DESC
    operations-sorter: method
    tags-sorter: alpha
