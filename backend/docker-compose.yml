version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-monitoring
    environment:
      POSTGRES_DB: monitoring_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network

  # RabbitMQ local para desarrollo: simula el bus del Core (queue.healthgrid.cantero.ar).
  # Levantar la app con RABBITMQ_HOST=localhost RABBITMQ_USER=guest RABBITMQ_PASSWORD=guest
  # y crear a mano la cola monitoring.requests (Management UI: http://localhost:15672).
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-monitoring
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network

  wiremock:
    image: wiremock/wiremock:3.7.0
    container_name: wiremock-core
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    networks:
      - monitoring-network

volumes:
  postgres_data:
    driver: local

networks:
  monitoring-network:
    driver: bridge
